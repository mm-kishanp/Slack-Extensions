<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #1d1c1d;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      select {
        width: 100%;
        margin-top: 4px;
        padding: 4px;
      }
      .hint {
        color: #616061;
        font-size: 12px;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Slack Last Message Time</h1>
    <label><input type="checkbox" id="enabled" /> Show last message time</label>
    <label>
      Display format
      <select id="format">
        <option value="smart">Smart (3:45 PM / Sep 12, 3:45 PM)</option>
        <option value="full">Full date &amp; time (Sep 12, 2026, 3:45 PM)</option>
        <option value="compact">Compact (3:45 PM / Mon / Sep 12)</option>
        <option value="relative">Relative (5m / 3h / 2d)</option>
      </select>
    </label>
    <p class="hint">Hover a time in the sidebar to see the full date and time.</p>
    <script src="popup.js"></script>
  </body>
</html>
